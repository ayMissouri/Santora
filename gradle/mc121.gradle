base {
	archivesName = "${archives_base_name}-mc${project.ext.mcLabel}"
}

repositories {
	mavenCentral()
}

sourceSets {
	main {
		java.srcDirs += [rootProject.file('core/src/main/java')] +
			(['common'] + project.ext.extraTrees).collect {
				rootProject.file("shared/${it}/src/main/java")
			}

		resources.srcDirs += [
			rootProject.file('shared/common/src/main/resources'),
			rootProject.file('shared/musicGain/src/main/resources')
		]
	}
}

loom {
	mods {
		"santora" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.ext.mcVersion}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.ext.fabricApi}"
}

processResources {
	inputs.property 'version', project.version
	inputs.property 'minecraft_range', project.ext.mcRange
	inputs.property 'loader_version', loader_version

	filesMatching('fabric.mod.json') {
		expand version: project.version,
			minecraft_range: project.ext.mcRange,
			loader_version: loader_version
	}
}

def collectDist = tasks.register('collectDist', Sync) {
	from tasks.named('remapJar')
	into rootProject.layout.projectDirectory.dir("dist/mc${project.ext.mcLabel}")
}

tasks.named('build') {
	finalizedBy collectDist
}

tasks.withType(JavaCompile).configureEach {
	options.release = Integer.parseInt(java_version_121x)
	options.encoding = 'UTF-8'
}

java {
	toolchain.languageVersion = JavaLanguageVersion.of(Integer.parseInt(java_version_121x))
}

plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = "${archives_base_name}-mc${minecraft_label_261}"
}

repositories {
	mavenCentral()
}

sourceSets {
	main {
		java.srcDirs += [
			rootProject.file('core/src/main/java'),
			rootProject.file('shared/common/src/main/java'),
			rootProject.file('shared/identifier/src/main/java'),
			rootProject.file('shared/inputEvent/src/main/java'),
			rootProject.file('shared/musicGain/src/main/java'),
			rootProject.file('shared/mc26/src/main/java')
		]
		resources.srcDirs += [
			rootProject.file('shared/common/src/main/resources'),
			rootProject.file('shared/musicGain/src/main/resources')
		]
	}
}

loom {
	mods {
		"santora" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraft_version_261}"
	implementation "net.fabricmc:fabric-loader:${loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version_261}"
}

processResources {
	inputs.property 'version', project.version
	inputs.property 'minecraft_range', minecraft_range_261
	inputs.property 'loader_version', loader_version

	filesMatching('fabric.mod.json') {
		expand version: project.version,
			minecraft_range: minecraft_range_261,
			loader_version: loader_version
	}
}

def collectDist = tasks.register('collectDist', Sync) {
	from tasks.named('jar')
	into rootProject.layout.projectDirectory.dir("dist/mc${minecraft_label_261}")
}

tasks.named('build') {
	finalizedBy collectDist
}

tasks.withType(JavaCompile).configureEach {
	options.release = Integer.parseInt(java_version_261)
	options.encoding = 'UTF-8'
}

java {
	toolchain.languageVersion = JavaLanguageVersion.of(Integer.parseInt(java_version_261))
}
